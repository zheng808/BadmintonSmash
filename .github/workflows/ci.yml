name: CI

on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Synth dev
        working-directory: infra
        run: npx cdk synth --quiet -c env=dev -c senderEmail=ci@example.com -c alarmEmail=ci@example.com
      - name: Synth prod
        working-directory: infra
        run: npx cdk synth --quiet -c env=prod -c senderEmail=ci@example.com -c alarmEmail=ci@example.com
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high || true
